<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9A2.1 – Nơi Tình yêu bắt đầu từ trang sách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --red:#8b0f0f; --cream:#fff0dc; --ink:#2a1a14; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    font-family:"Be Vietnam Pro",system-ui,sans-serif; color:var(--cream);
    background:radial-gradient(ellipse at 50% 35%, #5a1414 0%, #2b0a0a 60%, #170505 100%);
    overflow:hidden; display:flex; flex-direction:column; align-items:center;
    -webkit-user-select:none; user-select:none;
  }
  #stage { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; padding:14px 8px 6px; }
  #book { margin:0 auto; }
  .page { background:#fff0dc; overflow:hidden; container-type:size; }
  .page img.pg { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; -webkit-user-drag:none; }
  .ov { position:absolute; z-index:2; }

  /* ---------- toolbar ---------- */
  #bar { display:flex; align-items:center; gap:6px; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  #bar button { background:rgba(255,240,220,.1); color:var(--cream); border:1px solid rgba(255,240,220,.22);
    width:40px; height:40px; border-radius:50%; cursor:pointer; display:grid; place-items:center; transition:background .15s; }
  #bar button:hover { background:rgba(255,240,220,.22); }
  #bar button:disabled { opacity:.35; cursor:default; }
  #bar svg { width:18px; height:18px; fill:currentColor; }
  #pageinfo { min-width:118px; text-align:center; font-size:14px; letter-spacing:.02em; }
  #pageinfo input { width:46px; background:transparent; color:var(--cream); border:1px solid rgba(255,240,220,.3);
    border-radius:6px; text-align:center; font:inherit; padding:3px 2px; }
  #hint { position:fixed; top:12px; left:50%; transform:translateX(-50%); font-size:13px; opacity:.75; pointer-events:none; transition:opacity 1s; white-space:nowrap; }

  /* ---------- page 4: music player ---------- */
  .p4-mask { left:1.2%; width:71.6%; top:88.4%; height:2.4%;
    background:linear-gradient(#fcf9f3 0 47%, #fff0dc 47% 100%); }
  .p4-track { left:2.1%; width:69.6%; top:89.05%; height:.75%; background:#3a3633; border-radius:99px; cursor:pointer; }
  .p4-track::after { content:""; position:absolute; left:0; right:0; top:-14px; bottom:-14px; }
  .p4-fill { position:absolute; left:0; top:0; bottom:0; width:0; background:#b3151b; border-radius:99px; }
  .p4-knob { position:absolute; top:50%; height:290%; aspect-ratio:1; transform:translate(-50%,-50%); left:0;
    background:#333; border:2px solid #fff0dc; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .p4-time { left:73.5%; top:87.6%; width:22%; font-size:2.6cqw; color:#7a1010; font-weight:600; text-align:left; white-space:nowrap; }
  .p4-btn { width:7.6%; height:5.8%; border-radius:50%; cursor:pointer; transform:translate(-50%,-50%); top:94.85%; }
  .p4-btn:hover { background:rgba(139,15,15,.08); }
  .p4-play { width:9.2%; height:6.9%; background:#262626; display:grid; place-items:center; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .p4-play:hover { background:#8b0f0f; }
  .p4-play svg { width:42%; height:42%; fill:#fff0dc; }
  .p4-loop.on { background:rgba(179,21,27,.18); }
  .p4-wave { left:73.5%; top:84.6%; display:flex; gap:3px; align-items:flex-end; height:2.2%; opacity:0; transition:opacity .3s; }
  .p4-wave i { display:block; width:4px; background:#b3151b; border-radius:2px; height:30%; }
  .playing .p4-wave { opacity:1; }
  .playing .p4-wave i { animation:eq .9s ease-in-out infinite alternate; }
  .p4-wave i:nth-child(2){animation-delay:-.3s} .p4-wave i:nth-child(3){animation-delay:-.6s} .p4-wave i:nth-child(4){animation-delay:-.15s} .p4-wave i:nth-child(5){animation-delay:-.45s}
  @keyframes eq { from{height:20%} to{height:100%} }

  /* ---------- videos ---------- */
  .vbox { background:#111; }
  .vbox video { width:100%; height:100%; display:block; object-fit:cover; background:#000; }
  .vbox .big { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(44px,18%,84px); aspect-ratio:1;
    border-radius:50%; background:rgba(139,15,15,.88); border:3px solid #fff0dc; display:grid; place-items:center; cursor:pointer;
    box-shadow:0 4px 18px rgba(0,0,0,.45); transition:transform .15s; }
  .vbox .big:hover { transform:translate(-50%,-50%) scale(1.07); }
  .vbox .big svg { width:42%; height:42%; fill:#fff0dc; margin-left:8%; }
  .vbox.started .big { display:none; }
  .v53 { left:10.76%; top:45.71%; width:77.62%; height:32.71%; }
  .v61 { left:31.2%; top:31.6%; width:37.6%; height:49.2%; padding:1.1%; background:#fff;
    box-shadow:0 6px 16px rgba(80,10,10,.35); transform:rotate(-1.2deg); }
  .v61 video { border-radius:2px; }
  .v61 .tape { position:absolute; top:-2.2%; left:50%; width:34%; height:4.2%; transform:translateX(-50%) rotate(3deg);
    background:rgba(238,222,180,.85); box-shadow:0 1px 2px rgba(0,0,0,.15); z-index:3; pointer-events:none; }
  .v61 .big { width:clamp(44px,30%,84px); }
</style>
</head>
<body>
<div id="hint">Kéo góc trang hoặc dùng phím ← → để lật</div>
<div id="stage"><div id="book"></div></div>
<div id="bar">
  <button id="first" title="Trang bìa"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
  <button id="prev" title="Trang trước"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
  <div id="pageinfo"><input id="goto" inputmode="numeric" aria-label="Đi tới trang"> <span id="total">/ 64</span></div>
  <button id="next" title="Trang sau"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
  <button id="last" title="Trang cuối"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  <button id="fs" title="Toàn màn hình"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg></button>
</div>

<script src="js/page-flip.browser.js"></script>
<script>
const N = 64;
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
const book = document.getElementById('book');
const pad = n => String(n).padStart(2, '0');

for (let i = 1; i <= N; i++) {
  const d = document.createElement('div');
  d.className = 'page';
  if (i === 1 || i === N) d.dataset.density = 'hard';
  d.innerHTML = `<img class="pg" alt="Trang ${i}" data-src="pages/p-${pad(i)}.webp">`;
  book.appendChild(d);
}
const pages = [...book.children];

/* ---- page 4: audio player wired onto the printed controls ---- */
pages[3].insertAdjacentHTML('beforeend', `
  <audio id="aud" src="media/audio.mp3" preload="metadata"></audio>
  <div class="ov p4-mask"></div>
  <div class="ov p4-track media"><div class="p4-fill"></div><div class="p4-knob"></div></div>
  <div class="ov p4-wave"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ov p4-time">0:00 / 0:00</div>
  <div class="ov p4-btn media p4-shuf" style="left:14.5%" title="Phát lại từ đầu"></div>
  <div class="ov p4-btn media p4-back" style="left:26.4%" title="Lùi 10 giây"></div>
  <div class="ov p4-btn media p4-play" style="left:37.6%" title="Phát / Tạm dừng">${ICON_PLAY}</div>
  <div class="ov p4-btn media p4-fwd" style="left:48.3%" title="Tới 10 giây"></div>
  <div class="ov p4-btn media p4-loop" style="left:60.5%" title="Lặp lại"></div>`);

/* ---- page 53 & 61: videos ---- */
pages[52].insertAdjacentHTML('beforeend', `
  <div class="ov vbox v53 media"><video src="media/bamboo.mp4" poster="media/bamboo.jpg" preload="none" playsinline controls controlsList="nodownload"></video>
  <div class="big">${ICON_PLAY}</div></div>`);
pages[60].insertAdjacentHTML('beforeend', `
  <div class="ov vbox v61 media"><span class="tape"></span><video src="media/phuhuynh.mp4" poster="media/phuhuynh.jpg" preload="none" playsinline controls controlsList="nodownload"></video>
  <div class="big">${ICON_PLAY}</div></div>`);

/* keep clicks on media from turning the page */
document.querySelectorAll('.media').forEach(el => {
  ['mousedown','touchstart','pointerdown'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation(), {passive:true}));
});

/* ---- sizing ---- */
const stage = document.getElementById('stage');
function fitBook() {
  const W = stage.clientWidth - 16, H = stage.clientHeight - 20;
  let w = Math.min(W, H * 1.5);              // two pages side by side (3:4 each)
  if (w < 640 || W < 700) w = Math.min(W, H * 0.75, 599); // single page
  const two = w >= 600;
  book.style.width = Math.floor(w) + 'px';
  book.style.height = Math.floor(two ? w / 1.5 : w / 0.75) + 'px';
}
fitBook();
window.addEventListener('resize', fitBook);

const flip = new St.PageFlip(book, {
  width: 540, height: 720, size: 'stretch',
  minWidth: 300, maxWidth: 1400, minHeight: 400, maxHeight: 1900,
  showCover: true, usePortrait: true, autoSize: false, mobileScrollSupport: false,
  maxShadowOpacity: 0.45, flippingTime: 800, drawShadow: true
});
flip.loadFromHTML(pages);

/* ---- lazy image loading ---- */
const imgs = pages.map(p => p.querySelector('img.pg'));
const load = i => { const im = imgs[i]; if (im && !im.src) im.src = im.dataset.src; };
function loadAround(i) { for (let k = i - 3; k <= i + 6; k++) load(k); }
loadAround(0);
window.addEventListener('load', () => { let k = 0; const t = setInterval(() => { load(k++); if (k >= N) clearInterval(t); }, 120); });

/* ---- audio controls ---- */
const aud = document.getElementById('aud');
const p4 = pages[3];
const playBtn = p4.querySelector('.p4-play'), fill = p4.querySelector('.p4-fill'),
      knob = p4.querySelector('.p4-knob'), timeEl = p4.querySelector('.p4-time'), track = p4.querySelector('.p4-track');
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + pad(Math.floor(s % 60)) : '0:00';
function renderAudio() {
  const r = aud.duration ? aud.currentTime / aud.duration : 0;
  fill.style.width = knob.style.left = (r * 100) + '%';
  timeEl.textContent = fmt(aud.currentTime) + ' / ' + fmt(aud.duration);
  playBtn.innerHTML = aud.paused ? ICON_PLAY : ICON_PAUSE;
  p4.classList.toggle('playing', !aud.paused);
}
['timeupdate','loadedmetadata','play','pause','ended'].forEach(e => aud.addEventListener(e, renderAudio));
const tryPlay = m => { const p = m.play(); if (p) p.catch(() => {}); };
playBtn.onclick = () => aud.paused ? (pauseAll(aud), tryPlay(aud)) : aud.pause();
p4.querySelector('.p4-back').onclick = () => aud.currentTime = Math.max(0, aud.currentTime - 10);
p4.querySelector('.p4-fwd').onclick = () => aud.currentTime = Math.min(aud.duration || 0, aud.currentTime + 10);
p4.querySelector('.p4-shuf').onclick = () => { aud.currentTime = 0; pauseAll(aud); tryPlay(aud); };
p4.querySelector('.p4-loop').onclick = e => { aud.loop = !aud.loop; e.currentTarget.classList.toggle('on', aud.loop); };
function seek(e) {
  const r = track.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX);
  if (aud.duration) aud.currentTime = Math.min(1, Math.max(0, (x - r.left) / r.width)) * aud.duration;
}
let dragging = false;
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); seek(e); });
track.addEventListener('pointermove', e => dragging && seek(e));
track.addEventListener('pointerup', () => dragging = false);
renderAudio();

/* ---- videos ---- */
document.querySelectorAll('.vbox').forEach(box => {
  const v = box.querySelector('video');
  box.querySelector('.big').onclick = () => { pauseAll(v); tryPlay(v); };
  v.addEventListener('play', () => { box.classList.add('started'); pauseAll(v); });
});
const allMedia = [aud, ...document.querySelectorAll('video')];
function pauseAll(except) { allMedia.forEach(m => { if (m !== except && !m.paused) m.pause(); }); }

/* ---- navigation state ---- */
const gotoEl = document.getElementById('goto'), totalEl = document.getElementById('total');
function visible() {
  const i = flip.getCurrentPageIndex();
  if (flip.getOrientation() === 'portrait') return [i];
  if (i === 0) return [0];
  if (i === N - 1 && N % 2 === 0) return [i];
  return i % 2 ? [i, i + 1] : [i - 1, i];
}
let lastVis = [];
function onPage() {
  const vis = visible().filter(i => i < N);
  vis.forEach(loadAround);
  gotoEl.value = vis.map(i => i + 1).join('–');
  gotoEl.style.width = vis.length > 1 ? '62px' : '46px';
  document.getElementById('prev').disabled = document.getElementById('first').disabled = vis[0] === 0;
  document.getElementById('next').disabled = document.getElementById('last').disabled = vis[vis.length - 1] >= N - 1;
  // pause media that went off-screen
  allMedia.forEach(m => { const pg = m.closest('.page'); if (!vis.includes(pages.indexOf(pg)) && !m.paused) m.pause(); });
  // the song starts by itself when its page opens
  if (vis.includes(3) && !lastVis.includes(3) && aud.paused) { pauseAll(aud); tryPlay(aud); }
  lastVis = vis;
}
flip.on('flip', onPage);
flip.on('changeOrientation', onPage);
flip.on('init', onPage);
setTimeout(onPage, 50);

document.getElementById('prev').onclick = () => flip.flipPrev();
document.getElementById('next').onclick = () => flip.flipNext();
document.getElementById('first').onclick = () => flip.flip(0);
document.getElementById('last').onclick = () => flip.flip(N - 1);
gotoEl.addEventListener('focus', () => gotoEl.select());
gotoEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const n = parseInt(gotoEl.value, 10);
  if (n >= 1 && n <= N) { loadAround(n - 1); flip.flip(n - 1); }
  gotoEl.blur();
});
document.addEventListener('keydown', e => {
  if (e.target === gotoEl) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') flip.flipNext();
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') flip.flipPrev();
});
document.getElementById('fs').onclick = () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const r = document.documentElement.requestFullscreen(); if (r) r.catch(() => {}); }
  } catch (e) {}
};
setTimeout(() => document.getElementById('hint').style.opacity = 0, 4500);
</script>
</body>
</html>
